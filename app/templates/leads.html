{% extends 'base.html' %}{% block content %}<div class="head"><h1>Prospects</h1><a class="button" href="/export.csv">Exporter CSV</a></div><form class="filters"><input name="q" value="{{q}}" placeholder="Nom ou adresse"><input name="min_score" type="number" min="0" max="5" value="{{min_score}}"><button>Filtrer</button></form><table><tr><th>Nom</th><th>Type</th><th>Ville</th><th>Telephone</th><th>Avis</th><th>Note</th><th>Score</th><th>WhatsApp</th></tr>{% for x in rows %}<tr><td><a class="lead-link" href="/leads/{{x.id}}">{{x.name}}</a></td><td>{{x.business_type}}</td><td>{{x.city}}</td><td>{{x.phone}}</td><td>{{x.reviews_count}}</td><td>{{x.rating or '-'}}</td><td><b>{{x.score}}</b></td><td><a target="_blank" href="{{x.whatsapp_url}}">Ouvrir</a></td></tr>{% endfor %}</table>{% endblock %}
