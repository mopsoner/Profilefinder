{% extends 'base.html' %}{% block content %}<h1>Nouvelle recherche</h1><form method="post" class="panel"><label>Ville<input name="city" required></label><div class="grid"><label>Latitude<input name="latitude" type="number" step="any" required></label><label>Longitude<input name="longitude" type="number" step="any" required></label><label>Rayon (m)<input name="radius" type="number" value="1000"></label><label>Anneaux de grille<input name="rings" type="number" min="0" max="5" value="1"></label><label>Max / appel<input name="max_results" type="number" min="1" max="20" value="20"></label></div><h3>Types d'entreprise</h3><div class="checks">{% for x in types %}<label><input type="checkbox" name="business_types" value="{{x}}"> {{x}}</label>{% endfor %}</div><button>Lancer la recherche</button></form>{% endblock %}
