<!doctype html><html lang="fr"><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}body{font-family:Arial,sans-serif;color:#fff}.scene-bg,.scene-copy,.scene-chrome{position:absolute;inset:0;overflow:hidden}.scene-bg{background:#17191b}.scene-bg img{width:100%;height:100%;object-fit:cover;object-position:center;transform:scale({{'1.09' if index%2==0 else '1'}})}.scene-bg:after{content:'';position:absolute;inset:0;background:linear-gradient(0deg,#000a 0%,#0003 38%,transparent 65%),linear-gradient(180deg,#0004,transparent 20%)}.scene-copy{display:flex;align-items:{{'center' if art.text_position=='center' else 'flex-end'}};padding:{{'15% 7% 18%' if portrait else '14% 7% 13%'}}}.copy-content{max-width:{{'94%' if portrait else '68%'}};margin-left:{{'auto' if art.text_position in ('right','center') else '0'}};margin-right:{{'auto' if art.text_position=='center' else '0'}};text-align:{{'right' if art.text_position=='right' else 'center' if art.text_position=='center' else 'left'}}}h1{font-family:{{'Georgia,serif' if art.serif else 'Arial,sans-serif'}};font-size:{{headline_size}}px;line-height:1.12;letter-spacing:-1.5px;text-wrap:balance;font-weight:{{'500' if art.serif else '700'}};margin:0;text-shadow:0 2px 30px #0008;overflow-wrap:anywhere}.scene-copy{visibility:{{'hidden' if art.text_position=='none' or not art.headline else 'visible'}}}.scene-chrome{padding:6% 7%;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none}header,footer{font-size:{{'24' if portrait else '20'}}px;letter-spacing:.5px;min-height:1px;text-shadow:0 1px 18px #0008}header{font-weight:600;max-width:85%}footer{display:flex;justify-content:space-between;align-items:center;gap:25px}.final-brand{font-size:{{'30' if portrait else '25'}}px;font-weight:600}.contact{font-size:{{'25' if portrait else '21'}}px}
</style><body><div class="scene-bg"><img src="{{art.image}}" alt=""></div><div class="scene-copy"><div class="copy-content"><h1>{{art.headline}}</h1></div></div><div class="scene-chrome"><header>{% if index==1 and index!=count %}{{lead.name}}{% endif %}</header><footer>{% if index==count %}<span class="final-brand">{{lead.name}}</span>{% if art.show_contact and lead.phone %}<span class="contact">{{lead.phone}}</span>{% endif %}{% endif %}</footer></div></body></html>
