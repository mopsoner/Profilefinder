<!doctype html><html lang="fr"><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:Arial,sans-serif;background:#0a0d16;color:#fff;position:relative;padding:5.5%;display:flex;flex-direction:column;justify-content:space-between}.glow{position:absolute;width:100%;height:80%;top:-30%;left:30%;background:radial-gradient(ellipse,#7964be55,transparent 65%)}header,footer,.content{position:relative;z-index:1}header{display:flex;justify-content:space-between;align-items:center;font-size:22px;letter-spacing:3px;text-transform:uppercase;color:#c3f86c}.count{color:#999fb4;font-size:18px}.screen{position:absolute;top:{{'17%' if portrait else '13%'}};left:{{'6%' if portrait else '30%'}};width:{{'88%' if portrait else '66%'}};height:{{'53%' if portrait else '68%'}};border-radius:24px;border:2px solid #a395ff60;overflow:hidden;box-shadow:0 35px 110px #0009;transform:rotate(-2deg);background:#151822}.screen img{width:100%;height:100%;object-fit:contain;object-position:top center}.veil{position:absolute;inset:0;background:linear-gradient(0deg,#0a0d16 10%,#0a0d16dd 25%,transparent 64%)}.content{margin-top:auto;max-width:{{'100%' if portrait else '80%'}}}.eyebrow{color:#c3f86c;font-size:{{'24' if portrait else '20'}}px;letter-spacing:3px;text-transform:uppercase;margin-bottom:22px}h1{font-size:{{font_size}}px;line-height:1.23;letter-spacing:-1.5px;font-weight:600;margin:0 0 35px;text-wrap:balance;overflow-wrap:anywhere}footer{display:flex;justify-content:space-between;gap:20px;font-size:{{'21' if portrait else '18'}}px;color:#abb2c6;border-top:1px solid #ffffff28;padding-top:22px;margin-top:18px}.contact{color:#c3f86c}header strong{max-width:80%;overflow-wrap:anywhere}
</style><body><div class="glow"></div><header><strong>{{lead.name}}</strong><span class="count">{{'%02d'|format(index)}} / {{'%02d'|format(count)}}</span></header><div class="screen"><img src="data:image/png;base64,{{image}}" alt=""></div><div class="veil"></div><div class="content"><div class="eyebrow">{{lead.city or 'Découvrez notre univers'}}</div><h1>{{caption}}</h1></div><footer><span>{{lead.name}}</span><span class="contact">{{lead.phone or 'Découvrez notre site'}}</span></footer></body></html>
